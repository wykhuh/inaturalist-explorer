<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/assets/style.css" />
    <title>iNaturalist Explorer</title>
    <script type="module" src="/src/main.ts"></script>
    <script type="module">
      window.app.store.record_type = "identifications";
    </script>
  </head>
  <body id="home">
    <x-header></x-header>

    <main>
      <x-identifications-header
        data-updatecounts="true"
      ></x-identifications-header>
      <div id="wrapper">
        <div id="site-controls" class="sidebar-open">
          <button id="sidebar-toggle" title="Toggle sidebar">&#9776;</button>
          <button id="identifications-menu-toggle" title="Identifications">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              height="16px"
              viewBox="0 0 512 512"
            >
              <path
                d="M172.268 501.67C26.97 291.031 0 269.413 0 192 0 85.961 85.961 0 192 0s192 85.961 192 192c0 77.413-26.97 99.031-172.268 309.67-9.535 13.774-29.93 13.773-39.464 0z"
              />
            </svg>
          </button>
          <button id="settings-menu-toggle" title="Settings">&#9881;</button>
        </div>

        <section class="two-columns sidebar-open" id="site-layout">
          <div id="sidebar-menu">
            <x-identifications-menu></x-identifications-menu>
            <x-settings-menu></x-settings-menu>
            <div id="display-json">
              <div class="controls"></div>
              <pre id="display-json-wrapper" class="hide"></pre>
            </div>
          </div>
          <div id="view-container"></div>
        </section>
      </div>
    </main>

    <template id="identifications-menu-template">
      <div id="identifications-menu">
        <div class="form-group">
          <label>
            Search for
            <select id="search-type" name="search-type">
              <option selected value="taxa">Species</option>
              <option value="places">iNaturalist Places</option>
              <option value="users">Users (identifiers)</option>
            </select>
          </label>
        </div>

        <div class="form-group">
          <label
            >Search
            <input id="inatAutocomplete" type="text" autocomplete="off" />
          </label>
        </div>
        <div class="dialog-container">
          <x-identifications-filters></x-identifications-filters>
        </div>

        <h2 class="taxa-heading">Species</h2>
        <ul id="selected-species-list"></ul>

        <h2 class="observation-taxa-heading" hidden>Observation Species</h2>
        <ul id="selected-observation-species-list"></ul>

        <h2 class="places-heading" hidden>Places</h2>
        <ul id="selected-places-list"></ul>

        <h2 class="users-heading" hidden>Users (identifiers)</h2>
        <ul id="selected-users-list"></ul>
      </div>
    </template>
  </body>
</html>
